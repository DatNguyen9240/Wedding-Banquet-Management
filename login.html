<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Đăng nhập - Wedding CRM</title>
  
  <link rel="stylesheet" href="./src/css/styles.bundle.css?v=4">
  
  <!-- Theme Init (Để tránh chớp nền khi load) -->
  <script>
    (function() {
      var savedTheme = localStorage.getItem('pmql_theme') || 'auto';
      if (savedTheme === 'dark' || (savedTheme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark-theme');
      }
    })();
  </script>

  <style>
    :root {
      --auth-bg: #f8fafc;
      --auth-card-bg: #ffffff;
      --auth-border: #e2e8f0;
      --auth-text: #0f172a;
      --auth-text-muted: #64748b;
    }
    html.dark-theme, body.dark-theme {
      --auth-bg: #0f172a;
      --auth-card-bg: #1e293b;
      --auth-border: #334155;
      --auth-text: #f8fafc;
      --auth-text-muted: #94a3b8;
      background: var(--auth-bg);
    }
    
    body {
      margin: 0;
      font-family: var(--font-family, 'Inter', sans-serif);
      background: var(--auth-bg);
      color: var(--auth-text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      transition: background-color 0.3s;
    }

    .theme-btn {
      position: absolute;
      top: 24px;
      right: 24px;
      background: var(--auth-card-bg);
      border: 1px solid var(--auth-border);
      color: var(--auth-text);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .theme-btn:hover {
      background: var(--color-bg, #f1f5f9);
    }

    .auth-card {
      background: var(--auth-card-bg);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 20px 40px -15px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
      border: 1px solid var(--auth-border);
      animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      transform: translateY(20px);
    }

    .auth-logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .auth-logo .icon-box {
      width: 64px;
      height: 64px;
      background: rgba(79, 70, 229, 0.1);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      color: var(--color-primary, #4f46e5);
    }
    .auth-logo h2 {
      font-size: 24px;
      font-weight: 700;
      margin: 0 0 8px 0;
    }
    .auth-logo p {
      color: var(--auth-text-muted);
      font-size: 14px;
      margin: 0;
    }

    .form-group {
      margin-bottom: 20px;
    }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--auth-text-muted);
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-icon {
      position: absolute;
      left: 14px;
      color: var(--auth-text-muted);
      display: flex;
      pointer-events: none;
    }
    .form-input {
      width: 100%;
      padding: 12px 16px 12px 42px;
      border-radius: 10px;
      border: 1px solid var(--auth-border);
      background: var(--auth-bg);
      color: var(--auth-text);
      font-size: 15px;
      transition: all 0.2s;
    }
    .form-input.has-toggle {
      padding-right: 42px;
    }
    .form-input:focus {
      outline: none;
      border-color: var(--color-primary, #4f46e5);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }

    .btn-toggle-pw {
      position: absolute;
      right: 14px;
      background: none;
      border: none;
      color: var(--auth-text-muted);
      cursor: pointer;
      display: flex;
      padding: 0;
    }
    .btn-toggle-pw:hover {
      color: var(--color-primary, #4f46e5);
    }

    .form-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      font-size: 14px;
    }
    .checkbox-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--auth-text-muted);
      cursor: pointer;
    }
    .checkbox-wrap input {
      accent-color: var(--color-primary, #4f46e5);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }
    .link {
      color: var(--color-primary, #4f46e5);
      text-decoration: none;
      font-weight: 500;
    }
    .link:hover {
      text-decoration: underline;
    }

    .btn-primary {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      background: var(--color-primary, #4f46e5);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .btn-primary:hover:not(:disabled) {
      filter: brightness(1.1);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2);
    }
    .btn-primary:active:not(:disabled) {
      transform: translateY(0);
    }
    .btn-primary:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .btn-spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    #login-error {
      background: rgba(225, 29, 72, 0.1);
      color: #e11d48;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 20px;
      display: none;
      text-align: center;
      border: 1px solid rgba(225, 29, 72, 0.2);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Theme toggle -->
  <button class="theme-btn" id="btn-theme" aria-label="Đổi giao diện">
    <svg id="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
    </svg>
    <svg id="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
      <circle cx="12" cy="12" r="5"></circle>
      <line x1="12" y1="1" x2="12" y2="3"></line>
      <line x1="12" y1="21" x2="12" y2="23"></line>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
      <line x1="1" y1="12" x2="3" y2="12"></line>
      <line x1="21" y1="12" x2="23" y2="12"></line>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
    </svg>
  </button>

  <div class="auth-card">
    <div class="auth-logo">
      <div class="icon-box">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
        </svg>
      </div>
      <h2>Wedding CRM</h2>
      <p>Đăng nhập hệ thống quản lý</p>
    </div>

    <form id="login-form">
      <div id="login-error"></div>

      <div class="form-group">
        <label class="form-label" for="login-username">Tên đăng nhập</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </span>
          <input type="text" id="login-username" class="form-input" placeholder="Nhập tên đăng nhập" autocomplete="username" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="login-password">Mật khẩu</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </span>
          <input type="password" id="login-password" class="form-input has-toggle" placeholder="Nhập mật khẩu" autocomplete="current-password" required>
          <button type="button" class="btn-toggle-pw" aria-label="Hiện/Ẩn mật khẩu">
            <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg class="eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path>
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
      </div>

      <div class="form-row">
        <label class="checkbox-wrap">
          <input type="checkbox" id="remember-me">
          Ghi nhớ đăng nhập
        </label>
        <a href="#" class="link">Quên mật khẩu?</a>
      </div>

      <button type="submit" class="btn-primary" id="btn-login">
        <span class="btn-spinner" id="login-spinner"></span>
        <span id="btn-login-text">Đăng nhập</span>
      </button>
    </form>
  </div>

  <script src="./env.js?v=1"></script>
  <script src="./src/js/utils/apiClient.js?v=1"></script>
  <script>
    // 1. Kiểm tra redirect nếu đã có token
    if (typeof ApiClient !== 'undefined' && ApiClient.getCookie) {
      if (ApiClient.getCookie('auth_token')) {
        window.location.href = 'index.html';
      }
    }

    // 2. Theme Toggle Logic
    (function() {
      var btnTheme = document.getElementById('btn-theme');
      var iconMoon = document.getElementById('icon-moon');
      var iconSun = document.getElementById('icon-sun');

      function updateThemeUI(isDark) {
        if (isDark) {
          document.body.classList.add('dark-theme');
          document.documentElement.classList.add('dark-theme');
          iconMoon.style.display = 'none';
          iconSun.style.display = 'block';
        } else {
          document.body.classList.remove('dark-theme');
          document.documentElement.classList.remove('dark-theme');
          iconMoon.style.display = 'block';
          iconSun.style.display = 'none';
        }
      }

      var savedTheme = localStorage.getItem('pmql_theme') || 'auto';
      var isDark = savedTheme === 'dark' || (savedTheme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      updateThemeUI(isDark);

      btnTheme.addEventListener('click', function() {
        var currentlyDark = document.body.classList.contains('dark-theme');
        var newDark = !currentlyDark;
        localStorage.setItem('pmql_theme', newDark ? 'dark' : 'light');
        updateThemeUI(newDark);
      });
    })();

    // 3. Password Toggle Logic
    (function() {
      var btnTogglePw = document.querySelector('.btn-toggle-pw');
      var inputPw = document.getElementById('login-password');
      var eyeOpen = btnTogglePw.querySelector('.eye-open');
      var eyeOff = btnTogglePw.querySelector('.eye-off');
      
      btnTogglePw.addEventListener('click', function() {
        if (inputPw.type === 'password') {
          inputPw.type = 'text';
          eyeOpen.style.display = 'none';
          eyeOff.style.display = 'block';
        } else {
          inputPw.type = 'password';
          eyeOpen.style.display = 'block';
          eyeOff.style.display = 'none';
        }
      });
    })();

    // 4. Remember Me & Login Logic
    (function() {
      const usernameInput = document.getElementById('login-username');
      const passwordInput = document.getElementById('login-password');
      const rememberCheckbox = document.getElementById('remember-me');

      // Helper for UTF-8 safe Base64 obfuscation
      const b64Encode = (str) => btoa(unescape(encodeURIComponent(str)));
      const b64Decode = (str) => {
        try { return decodeURIComponent(escape(atob(str))); }
        catch (e) { return ''; }
      };

      // Tự động điền nếu đã lưu
      setTimeout(() => {
        const rememberedUser = localStorage.getItem('remember_user');
        const rememberedPw = localStorage.getItem('remember_pw');

        if (rememberedUser && rememberedPw) {
          usernameInput.value = rememberedUser;
          passwordInput.value = b64Decode(rememberedPw);
          rememberCheckbox.checked = true;
        }
      }, 100);

      document.getElementById('login-form').addEventListener('submit', function(e) {
        e.preventDefault();
        
        var user = usernameInput.value.trim();
        var pass = passwordInput.value;
        var errEl = document.getElementById('login-error');
        var btnText = document.getElementById('btn-login-text');
        var btnSpinner = document.getElementById('login-spinner');
        var btn = document.getElementById('btn-login');
        
        errEl.style.display = 'none';

        if (user && pass) {
          btnText.innerText = 'Đang đăng nhập...';
          btnSpinner.style.display = 'block';
          btn.disabled = true;

          ApiClient.post(API_CONFIG.ENDPOINTS.AUTH.LOGIN, { username: user, password: pass })
            .then(function(res) {
              if (res && res.code === 0) {
                var token = res.access_token || '';
                if (token && typeof ApiClient !== 'undefined' && ApiClient.setCookie) {
                  ApiClient.setCookie('auth_token', token, 7);
                }

                // Nếu chọn "Ghi nhớ đăng nhập", lưu vào localStorage
                if (rememberCheckbox.checked) {
                  localStorage.setItem('remember_user', user);
                  localStorage.setItem('remember_pw', b64Encode(pass));
                } else {
                  localStorage.removeItem('remember_user');
                  localStorage.removeItem('remember_pw');
                }

                // Lưu trực tiếp Schema từ response Login vào localStorage
                localStorage.setItem('pmql_user', JSON.stringify(res));
                
                // Redirect sang trang chủ
                window.location.href = 'index.html';
              } else {
                throw new Error(res.msg || 'Tên đăng nhập hoặc mật khẩu không đúng');
              }
            })
            .catch(function(err) {
              errEl.innerText = err.message || 'Lỗi kết nối máy chủ';
              errEl.style.display = 'block';
              btnText.innerText = 'Đăng nhập';
              btnSpinner.style.display = 'none';
              btn.disabled = false;
            });
        }
      });
    })();
  </script>
</body>
</html>
