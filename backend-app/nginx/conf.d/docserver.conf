server {
    listen 80;
    server_name qlt.bms79.com;
    # Redirect HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name qlt.bms79.com;

    # SSL — Let's Encrypt (certbot tự tạo hoặc copy cert sẵn)
    ssl_certificate     /etc/letsencrypt/live/qlt.bms79.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qlt.bms79.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ─── Node.js Document Server (backend-app Docker container) ───────────
    location /docserver/ {
        rewrite ^/docserver/(.*)$ /$1 break;
        proxy_pass         http://backend-app:8081;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;

        # CORS (cần nếu frontend trên Vercel gọi trực tiếp)
        add_header 'Access-Control-Allow-Origin'  '*'                                 always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE'   always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type'       always;

        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Allow-Origin'  '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type';
            add_header 'Content-Length' 0;
            return 204;
        }
    }

    # ─── Main API Gateway (C# / SQL Server backend) ───────────────────────
    # Toàn bộ /api/* còn lại forward về backend chính
    location /api/ {
        proxy_pass         https://qlt.bms79.com/api/;   # hoặc IP nội bộ của C# backend
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ─── Static fallback ─────────────────────────────────────────────────
    location / {
        return 404;
    }
}
