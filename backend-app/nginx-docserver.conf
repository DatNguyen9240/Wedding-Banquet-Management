# Nginx reverse proxy config để expose Node.js port 8081 qua HTTPS
# Thêm vào trong block `server { ... }` của domain qlt.bms79.com
#
# File này đặt tại: /etc/nginx/conf.d/ hoặc thêm vào nginx.conf hiện tại

# =============================================================
# OPTION A: Proxy qua path /docserver/ (KHÔNG cần subdomain mới)
# Sau khi thêm config này:
#   env.js: BASE_API = 'https://qlt.bms79.com/docserver/api/documents'
# =============================================================
location /docserver/ {
    # Rewrite để bỏ prefix /docserver trước khi forward
    rewrite ^/docserver/(.*)$ /$1 break;

    proxy_pass         http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection 'upgrade';
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;

    # Timeout cho generate DOCX (có thể lâu)
    proxy_read_timeout 120s;
    proxy_connect_timeout 30s;
    proxy_send_timeout 60s;

    # CORS headers (nếu cần)
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;

    if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type';
        add_header 'Content-Length' 0;
        add_header 'Content-Type' 'text/plain';
        return 204;
    }
}

