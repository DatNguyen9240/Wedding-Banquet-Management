<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình Soạn Thảo Tài Liệu - Wedding Banquet</title>
    <!-- Trỏ tới Document Server (Đổi URL này thành IP/Domain thực tế của server ONLYOFFICE) -->
    <script type="text/javascript" src="http://localhost:8080/web-apps/apps/api/documents/api.js"></script>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #f3f4f6;
            font-family: Arial, sans-serif;
        }
        #placeholder {
            height: 100%;
            width: 100%;
        }
        .error-msg {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            font-size: 18px;
            color: #ef4444;
        }
    </style>
</head>
<body>
    <div id="placeholder">
        <div class="error-msg">Đang tải cấu hình ONLYOFFICE...</div>
    </div>
    
    <script>
        // Lấy thông tin tài liệu từ URL Parameters
        const urlParams = new URLSearchParams(window.location.search);
        let docId = urlParams.get('docId');
        let fileUrl = urlParams.get('fileUrl');
        let fileName = urlParams.get('fileName') || "TaiLieu.docx";

        // TỰ ĐỘNG THÊM DỮ LIỆU TEST NẾU MỞ TRỰC TIẾP KHÔNG CÓ PARAMETER
        if (!docId || !fileUrl) {
            console.warn("⚠️ Mở trực tiếp nên đang dùng dữ liệu Test. Hãy thêm tham số ?docId=...&fileUrl=... trên URL nếu muốn mở file thật.");
            docId = "TEST-DOC-" + Math.floor(Math.random() * 1000);
            fileName = "MauHopDong.docx";
            // Dùng 1 file mẫu public của OnlyOffice để test xem editor lên hình không
            fileUrl = "https://raw.githubusercontent.com/ONLYOFFICE/Testing-Document-Server/master/example/public/assets/document-templates/en-US/sample.docx";
        }

        // Cấu hình nhúng ONLYOFFICE
        const config = {
            "document": {
                "fileType": fileName.split('.').pop().toLowerCase(),
                "key": docId + "_" + Date.now(), // Định danh duy nhất cho phiên làm việc
                "title": fileName,
                "url": fileUrl, // URL phải Public để ONLYOFFICE tải được file
                "permissions": {
                    "edit": true,
                    "download": true,
                    "print": true
                }
            },
            "documentType": "word",
            "editorConfig": {
                // API Callback hứng sự kiện Lưu
                // LƯU Ý QUAN TRỌNG: Sửa "192.168.1.xxx" thành IP mạng LAN thật của máy anh
                // hoặc "host.docker.internal" nếu xài Docker Desktop
                "callbackUrl": "http://host.docker.internal:5000/api/documents/callback?docId=" + docId + "&fileName=" + fileName,
                "lang": "vi",
                "user": {
                    "id": "user_" + Math.floor(Math.random() * 1000),
                    "name": "Nhân viên Wedding"
                },
                "customization": {
                    "autosave": true,
                    "forcesave": true,
                    "compactHeader": false,
                    "toolbarNoTabs": false
                }
            }
        };

            // Dọn dẹp câu thông báo đang tải và gắn Editor vào
            document.getElementById('placeholder').innerHTML = "";
            const docEditor = new DocsAPI.DocEditor("placeholder", config);
    </script>
</body>
</html>
