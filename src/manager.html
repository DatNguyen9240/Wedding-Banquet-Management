<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspace Tài Liệu - Wedding Banquet</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- ONLYOFFICE API (Chạy trên Docker) -->
    <script type="text/javascript" src="http://localhost:8080/web-apps/apps/api/documents/api.js"></script>

    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --danger: #ef4444;
            --bg-dark: #0f172a;
            --bg-sidebar: rgba(15, 23, 42, 0.95);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
            --glass: rgba(255, 255, 255, 0.03);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            overflow: hidden;
            background-color: var(--bg-dark);
            color: var(--text-main);
        }

        /* Sidebar Styling */
        .sidebar {
            width: 340px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            box-shadow: 4px 0 24px rgba(0, 0, 0, 0.2);
            z-index: 10;
        }

        .sidebar-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.2);
        }

        .brand {
            font-size: 1.25rem;
            font-weight: 700;
            background: linear-gradient(135deg, #a855f7, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 0.75rem;
            border: none;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), #818cf8);
            color: white;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.2);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
        }

        /* Document List */
        .doc-list-container {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
        }

        .doc-list-container::-webkit-scrollbar {
            width: 6px;
        }

        .doc-list-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .doc-item {
            padding: 1rem;
            background: var(--glass);
            border: 1px solid transparent;
            border-radius: 1rem;
            margin-bottom: 0.75rem;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .doc-item:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.1);
            transform: translateX(4px);
        }

        .doc-item.active {
            background: rgba(99, 102, 241, 0.15);
            border-color: rgba(99, 102, 241, 0.3);
        }

        .doc-item.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: var(--primary);
            border-radius: 4px 0 0 4px;
        }

        .doc-title {
            font-weight: 500;
            font-size: 0.95rem;
            margin-bottom: 0.4rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #e2e8f0;
        }

        .doc-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }

        .btn-delete {
            position: absolute;
            right: 0.75rem;
            top: 50%;
            transform: translateY(-50%) scale(0.9);
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .doc-item:hover .btn-delete {
            opacity: 1;
            transform: translateY(-50%) scale(1);
        }

        .btn-delete:hover {
            background: var(--danger);
            color: white;
        }

        /* Workspace Area */
        .workspace {
            flex: 1;
            background: #f1f5f9;
            /* ONLYOFFICE native UI renders best on light gray */
            position: relative;
            display: flex;
            flex-direction: column;
        }

        #workspace-area {
            flex: 1;
            width: 100%;
            height: 100%;
        }

        /* Empty State */
        .empty-state {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--bg-dark);
            color: var(--text-muted);
            z-index: 5;
        }

        .empty-state .icon-bg {
            width: 100px;
            height: 100px;
            background: rgba(99, 102, 241, 0.05);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .empty-state h2 {
            color: var(--text-main);
            font-weight: 500;
            margin-bottom: 0.5rem;
            font-size: 1.5rem;
        }

        /* Modal styling */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 100;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal {
            background: var(--bg-sidebar);
            border: 1px solid var(--border);
            border-radius: 1.25rem;
            padding: 2rem;
            width: 90%;
            max-width: 420px;
            transform: translateY(20px);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .modal-overlay.active .modal {
            transform: translateY(0);
        }

        .modal-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .modal-desc {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .form-control {
            width: 100%;
            padding: 0.85rem 1rem;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            color: white;
            font-size: 1rem;
            transition: all 0.2s;
            margin-bottom: 1.5rem;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .modal-actions {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid transparent;
            width: auto;
            padding: 0.8rem 1.5rem;
        }

        .btn-ghost:hover {
            background: rgba(255, 255, 255, 0.05);
            color: white;
        }

        .btn-primary.small {
            width: auto;
            padding: 0.8rem 1.5rem;
        }
    </style>
</head>

<body>

    <!-- Sidebar Trái -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="brand">
                <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10">
                    </path>
                </svg>
                Tài Liệu
            </div>
            <button class="btn btn-primary" onclick="openModal()">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                </svg>
                Tạo mới
            </button>
        </div>

        <div class="doc-list-container" id="doc-list">
            <div style="text-align:center; padding: 2rem; color: #94a3b8;">Đang tải dữ liệu...</div>
        </div>
    </aside>

    <!-- Content Chính (Trình soạn thảo) -->
    <main class="workspace">
        <div class="empty-state" id="empty-state">
            <div class="icon-bg">
                <svg width="40" height="40" fill="none" stroke="var(--primary)" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                        d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z">
                    </path>
                </svg>
            </div>
            <h2>Chưa chọn tài liệu</h2>
            <p>Vui lòng chọn một tài liệu ở menu bên trái để chỉnh sửa</p>
        </div>

        <!-- Nơi nhúng Editor -->
        <div id="workspace-area"></div>
    </main>

    <!-- Modal Tạo Mới -->
    <div class="modal-overlay" id="createModal">
        <div class="modal">
            <div class="modal-title">Tạo tài liệu mới</div>
            <div class="modal-desc">Nhập tên file bạn muốn tạo (Ví dụ: HopDongThang5)</div>

            <select id="templateTypeInput" class="form-control" style="margin-bottom: 1rem; cursor: pointer;">
                <option value="hop_dong">Hợp đồng Đặt Tiệc</option>
                <option value="quyet_toan">Biên bản Quyết Toán</option>
                <option value="dat_coc">Biên nhận Đặt Cọc</option>
            </select>

            <input type="text" id="fileNameInput" class="form-control" placeholder="Tên tài liệu..." autocomplete="off">

            <div class="modal-actions">
                <button class="btn btn-ghost" onclick="closeModal()">Hủy</button>
                <button class="btn btn-primary small" onclick="createDocument()">Tạo ngay</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = "http://127.0.0.1:5000/api/documents";
        const HOST_IP = "host.docker.internal";
        let currentActiveFile = null;

        async function loadDocuments() {
            try {
                const res = await fetch(API_BASE);
                const json = await res.json();

                const container = document.getElementById('doc-list');
                if (!json.data || json.data.length === 0) {
                    container.innerHTML = '<div style="text-align:center; padding: 2rem; color: #94a3b8;">Chưa có tài liệu nào</div>';
                    return;
                }

                container.innerHTML = '';
                json.data.forEach(doc => {
                    const dateStr = new Date(doc.updatedAt).toLocaleDateString('vi-VN');

                    const div = document.createElement('div');
                    div.className = `doc-item ${currentActiveFile === doc.fileName ? 'active' : ''}`;
                    div.onclick = () => openEditor(doc.fileName);

                    div.innerHTML = `
                        <div class="doc-title">
                            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24" color="#818cf8"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                            ${doc.fileName}
                        </div>
                        <div class="doc-meta">
                            <span>${doc.size}</span>
                            <span>${dateStr}</span>
                        </div>
                        <button class="btn-delete" onclick="deleteDocument(event, '${doc.fileName}')" title="Xóa tài liệu">
                            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                    `;
                    container.appendChild(div);
                });
            } catch (err) {
                console.error(err);
                document.getElementById('doc-list').innerHTML = `<div style="text-align:center; padding: 2rem; color: #ef4444;">Lỗi kết nối Server!</div>`;
            }
        }

        function openEditor(fileName) {
            currentActiveFile = fileName;
            loadDocuments(); // Re-render để cập nhật class .active

            // Ẩn empty state
            document.getElementById('empty-state').style.display = 'none';
            const workspace = document.getElementById('workspace-area');

            // Xóa editor cũ (bằng cách xóa HTML container) và tạo lại container mới
            workspace.innerHTML = '<div id="editor-placeholder" style="width: 100%; height: 100%;"></div>';

            const docId = fileName.replace('.docx', '');
            const fileUrl = `http://${HOST_IP}:5000/uploads/${fileName}`;

            const config = {
                "document": {
                    "fileType": fileName.split('.').pop().toLowerCase(),
                    "key": docId + "_" + Date.now(),
                    "title": fileName,
                    "url": fileUrl,
                    "permissions": { "edit": true, "download": true, "print": true }
                },
                "documentType": "word",
                "editorConfig": {
                    "callbackUrl": `http://host.docker.internal:5000/api/documents/callback?docId=${docId}&fileName=${fileName}`,
                    "lang": "vi",
                    "user": {
                        "id": "user_" + Math.floor(Math.random() * 1000),
                        "name": "Nhân viên Wedding"
                    },
                    "customization": {
                        "autosave": true,
                        "forcesave": true,
                        "compactHeader": false,
                        "toolbarNoTabs": false
                    }
                }
            };

            // Khởi tạo Editor mới
            new DocsAPI.DocEditor("editor-placeholder", config);
        }

        async function createDocument() {
            const input = document.getElementById('fileNameInput');
            const typeInput = document.getElementById('templateTypeInput');
            let name = input.value.trim();
            let templateType = typeInput.value;
            
            if (!name) return alert("Vui lòng nhập tên tài liệu!");

            try {
                const res = await fetch(API_BASE + '/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fileName: name, templateType: templateType })
                });
                const json = await res.json();

                if (json.success) {
                    closeModal();
                    input.value = "";
                    await loadDocuments();
                    // Tự động mở tài liệu vừa tạo
                    openEditor(json.fileName);
                } else {
                    alert("Lỗi: " + json.message);
                }
            } catch (err) {
                alert("Lỗi kết nối tới server!");
            }
        }

        async function deleteDocument(event, fileName) {
            event.stopPropagation(); // Ngăn sự kiện click lan ra doc-item (tránh mở file)
            if (!confirm(`Bạn có chắc chắn muốn xóa file ${fileName} không?`)) return;

            try {
                const res = await fetch(API_BASE + '/' + fileName, { method: 'DELETE' });
                const json = await res.json();
                if (json.success) {
                    if (currentActiveFile === fileName) {
                        currentActiveFile = null;
                        document.getElementById('workspace-area').innerHTML = '';
                        document.getElementById('empty-state').style.display = 'flex';
                    }
                    loadDocuments();
                } else {
                    alert("Lỗi: " + json.message);
                }
            } catch (err) {
                alert("Lỗi kết nối tới server!");
            }
        }

        // --- Logic Modal ---
        const modal = document.getElementById('createModal');
        const fileNameInput = document.getElementById('fileNameInput');

        function openModal() {
            modal.classList.add('active');
            fileNameInput.focus();
        }
        function closeModal() {
            modal.classList.remove('active');
            fileNameInput.value = '';
        }

        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });

        fileNameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') createDocument();
        });

        // Tải danh sách lúc đầu
        loadDocuments();
    </script>
</body>

</html>
