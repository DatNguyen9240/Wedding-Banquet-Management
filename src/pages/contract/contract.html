<!-- ═══════════════════════════════════════════
   HỢP ĐỒNG TIỆC - HTML Template
   ═══════════════════════════════════════════ -->

<div id="contract-list-view">
  <div class="page-title-bar">
    <span>Quản lý Hợp Đồng Tiệc</span>
  </div>

  <div class="d-flex align-items-center mb-4" style="animation: slideUp 0.3s ease forwards;">
    <button class="btn btn-primary d-flex align-items-center gap-2" id="btn-add-contract" style="border-radius: 8px;">
      <span class="material-symbols-outlined" style="font-size: 20px;">add_circle</span>Lập Hợp Đồng Mới
    </button>
    <button class="btn btn-secondary ms-auto d-flex align-items-center justify-content-center shadow-sm" id="btn-contract-more" style="width: 38px; height: 38px; padding: 0; border-radius: 8px; background: white;" title="Tùy chọn khác">
      <span class="material-symbols-outlined">more_vert</span>
    </button>
  </div>

  <div class="card" style="animation: slideUp 0.4s ease forwards;">
    <div class="table-wrapper" style="overflow-x: auto; width: 100%;">
      <table class="data-table selectable" id="contract-table">
        <thead>
          <tr>
            <th class="text-center" style="width: 50px;">STT</th>
            <th>Số Hợp Đồng</th>
            <th>Tên Khách Hàng (Cặp Đôi)</th>
            <th>Ngày Tổ Chức</th>
            <th>Số Bàn</th>
            <th class="text-end">Tổng Tiền (Dự Kiến)</th>
            <th class="text-center">Trạng thái</th>
          </tr>
        </thead>
        <tbody>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div id="contract-detail-view" style="display: none;"></div>
