<!-- ═══════════════════════════════════════════
   HỢP ĐỒNG TIỆC - HTML Template
   ═══════════════════════════════════════════ -->

<div class="contract-module-container" style="display:flex; flex-direction:column; min-height: 80vh; width: 100%;">
  <!-- Tabs Navigation Custom -->
  <div class="contract-tabs-header" style="background: var(--color-surface); border-bottom: 1px solid var(--color-border); padding: 0 24px; display: flex; gap: 16px; width: 100%;">
    <button id="tab-list-btn" class="custom-tab-btn active" style="padding: 12px 16px; font-weight: 500; font-size: 14px; color: var(--color-primary); background: transparent; border: none; border-bottom: 2px solid var(--color-primary); cursor: pointer;">
      Danh sách Hợp đồng
    </button>
    <button id="tab-detail-btn" class="custom-tab-btn" style="padding: 12px 16px; font-weight: 500; font-size: 14px; color: var(--color-text-secondary); background: transparent; border: none; border-bottom: 2px solid transparent; cursor: pointer;">
      Lập / Chi tiết Hợp đồng
    </button>
  </div>

  <style>
    .custom-tab-btn:hover { color: var(--color-primary) !important; }
    .custom-tab-btn.active { color: var(--color-primary) !important; border-bottom-color: var(--color-primary) !important; }
  </style>

  <!-- Tabs Content -->
  <div class="tab-content" style="flex:1; width: 100%;" id="contractTabsContent">
    
    <!-- PANE 1: LIST -->
    <div id="tab-list-pane" style="display: block; padding: 0; width: 100%;">
      <div id="contract-list-view" style="width: 100%;"></div>
    </div>
    
    <!-- PANE 2: DETAIL -->
    <div id="tab-detail-pane" style="display: none; padding: 24px 0; width: 100%;">
      <div id="contract-detail-view" style="width: 100%;"></div>
    </div>
  </div>
</div>
