<!-- ═══════════════════════════════════════════
   HỢP ĐỒNG TIỆC - HTML Template
   ═══════════════════════════════════════════ -->

<div id="contract-list-view">
  <div class="page-title-bar">
    <div class="page-title-info">
      <h1 class="page-title-heading">Hợp Đồng Tiệc</h1>
      <span class="page-title-sub">Quản lý và lập hợp đồng tiệc cưới, hội nghị</span>
    </div>
    <div class="page-title-actions">
      <button class="btn btn-primary d-flex align-items-center gap-2 rounded-pill" id="btn-add-contract" style="height: 40px; font-weight: 700;">
        <span class="material-symbols-outlined" style="font-size: 20px;">add</span>
        <span class="d-none d-sm-inline">Lập Hợp Đồng Mới</span>
        <span class="d-inline d-sm-none">Tạo Mới</span>
      </button>
      <button class="btn btn-outline d-flex align-items-center justify-content-center" id="btn-contract-more" style="width: 40px; height: 40px; padding: 0; border-radius: 50%;" title="Tùy chọn khác">
        <span class="material-symbols-outlined">more_vert</span>
      </button>
    </div>
  </div>

  <div class="card" style="animation: slideUp 0.4s ease forwards;">
    <div class="table-wrapper" style="overflow-x: auto; width: 100%;">
      <table class="data-table selectable" id="contract-table">
        <thead>
          <tr>
            <th class="text-center" style="width: 50px;">STT</th>
            <th>Số Hợp Đồng</th>
            <th>Tên Khách Hàng (Cặp Đôi)</th>
            <th>Ngày Tổ Chức</th>
            <th>Số Bàn</th>
            <th class="text-end">Tổng Tiền (Dự Kiến)</th>
            <th class="text-center">Trạng thái</th>
          </tr>
        </thead>
        <tbody>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div id="contract-detail-view" style="display: none;"></div>
