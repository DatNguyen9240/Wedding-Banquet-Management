<!-- ═══════════════════════════════════════════
   BÁO CÁO DOANH THU TIỆC - HTML Template
   Dùng Bootstrap 5 Grid & Utilities cho Layout
   ═══════════════════════════════════════════ -->

<!-- TIÊU ĐỀ TRANG -->
<div class="page-title-bar">
  <span>Báo cáo Doanh Thu Tiệc</span>
</div>

<!-- THANH CÔNG CỤ -->
<div class="button-bar mb-4" style="animation: slideUp 0.3s ease forwards;">
  <button class="btn btn-tool" id="btn-export">
    <span class="material-symbols-outlined">download</span>Xuất Excel
  </button>
  <button class="btn btn-tool" id="btn-print">
    <span class="material-symbols-outlined">print</span>In Báo Cáo
  </button>
</div>

<!-- BỘ LỌC -->
<div id="filter-wrapper" class="mb-4" style="animation: slideUp 0.4s ease forwards;"></div>

<!-- BIỂU ĐỒ -->
<div class="row mb-4" style="animation: slideUp 0.5s ease forwards;">
  <div class="col-12">
    <div class="card">
      <div class="card-header d-flex justify-content-between align-items-center">
        <span id="chart-title">Biểu đồ Doanh thu</span>
      </div>
      <div class="card-body p-0" id="chart-tabs-wrapper">
        <!-- TABS SẼ RENDER Ở ĐÂY BỞI JS -->
      </div>
    </div>
  </div>
</div>

<!-- BẢNG DỮ LIỆU -->
<div class="row" style="animation: slideUp 0.6s ease forwards;">
  <div class="col-12">
    <div class="card">
      <div class="card-header">
        <span id="table-title">Chi tiết Doanh thu</span>
      </div>
      <div class="table-wrapper">
        <table class="data-table" id="revenue-table">
          <thead>
            <tr>
              <th class="text-center" style="width: 120px;">Thời gian</th>
              <th class="text-center">Số lượng Tiệc</th>
              <th class="text-end">Tổng Doanh Thu (VNĐ)</th>
            </tr>
          </thead>
          <tbody>
            <!-- RENDER BỞI JS -->
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- TOTAL BAR -->
<div id="total-bar-wrapper" class="mt-3"></div>
