<div class="page-title-bar">
  <span>Phân quyền Cán bộ</span>
</div>

<div class="row g-4" style="animation: slideUp 0.3s ease forwards;">
  <!-- CỘT TRÁI: DANH SÁCH NHÓM QUYỀN -->
  <div class="col-lg-3 col-md-4">
    <div class="card h-100">
      <div class="card-header" style="background: var(--color-background);">
        <h3 class="mb-0" style="font-size: var(--font-size-md);">Nhóm quyền</h3>
      </div>
      <div class="card-body p-2" id="role-list-container">
        <!-- JS GENERATED ROLE LIST -->
      </div>
    </div>
  </div>

  <!-- CỘT PHẢI: CHI TIẾT PHÂN QUYỀN -->
  <div class="col-lg-9 col-md-8">
    <div class="card h-100 d-flex flex-column" style="overflow: hidden;">
      <div class="card-header d-flex justify-content-between align-items-center" style="background: var(--color-background);">
        <h3 class="d-flex align-items-center gap-2 mb-0" style="font-size: var(--font-size-md);">
          <span class="material-symbols-outlined" style="font-size:var(--font-size-lg);">account_tree</span>
          Chi tiết Phân quyền: <span id="current-role-name" style="color: var(--color-primary); font-weight: 600;"></span>
        </h3>
        <div class="d-flex gap-2">
          <button class="btn btn-outline-secondary" id="btn-sync-permission" style="padding: 4px 12px; font-size:var(--font-size-sm);">Đồng Bộ</button>
          <button class="btn btn-primary" id="btn-save-permission" style="padding: 4px 12px; font-size:var(--font-size-sm);">Lưu Thay Đổi</button>
        </div>
      </div>
      <div class="card-body table-wrapper p-0" style="border-radius:0 0 8px 8px; overflow-x: auto;">
        <table class="data-table" id="permission-tree-table" style="margin:0; min-width: 800px;">
          <thead>
            <tr>
              <th>Cấu trúc Phân quyền</th>
              <th class="text-center" style="width: 100px;">Xem</th>
              <th class="text-center" style="width: 100px;">Thêm</th>
              <th class="text-center" style="width: 100px;">Sửa</th>
              <th class="text-center" style="width: 100px;">Xóa</th>
            </tr>
          </thead>
          <tbody>
            <!-- JS GENERATED TREE ROWS -->
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
